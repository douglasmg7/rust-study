# Local development services for the database and capstone modules.
#
#   docker compose up -d postgres redis
#
# Then copy .env.example to .env (done once) so DATABASE_URL and REDIS_URL
# point at these services. Postgres 16 and Redis 7 are the versions the
# course was written and tested against.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: axum_course
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
