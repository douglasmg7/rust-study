default_job = "run"
env.CARGO_TERM_COLOR = "always"

[jobs.run]
command = [
  "cargo",
  "run",
  # put launch parameters for your program behind a `--` separator
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
# kill = ["pkill", "-TERM", "-P"]
scroll_anchor = "auto"
