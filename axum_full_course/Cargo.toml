    "module-01-intro",
    # "module-02-rust-http-essentials",
    # "module-03-handlers-responses",
    # "module-04-routing",
    # "module-05-extractors",
    # "module-06-responses",
    # "module-07-state",
    # "module-08-errors",
    # "module-09-validation",
    # "module-10-tower-basics",
    # "module-11-middleware",
    # "module-12-tower-http",
    # "module-13-static-html",
    # "module-14-sqlx-postgres",
    # "module-15-architecture",
    # "module-16-orms-databases",
    # "module-17-caching",
    # "module-18-rest-design",
    # "module-19-passwords",
    # "module-20-jwt",
    # "module-21-sessions",
    # "module-22-authorization",
    # "module-23-hardening",
    # "module-24-websockets",
    # "module-25-sse",
    # "module-26-streaming",
    # "module-27-uploads",
    # "module-28-resumable",
    # "module-29-range-downloads",
    # "module-30-media",
    # "module-31-background-jobs",
    # "module-32-http-clients",
    # "module-33-openapi",
    # "module-34-graphql",
    # "module-35-grpc",
    # "module-36-testing",
    # "module-37-observability",
    # "module-38-config",
    # "module-39-async-debugging",
    # "module-40-performance",
    # "module-41-serve",
    # "module-42-tls",
    # "module-43-docker",
    # "module-44-internals",
